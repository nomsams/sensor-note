name: Android debug APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Record build provenance
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-provenance.txt

      - name: Verify and hash APK
        run: |
          set -euo pipefail
          apk=$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f)
          test "$(printf '%s\n' "$apk" | wc -l)" -eq 1
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee apksigner-verification.txt
          sha256sum "$apk" build-provenance.txt apksigner-verification.txt > SHA256SUMS.txt
          sha512sum "$apk" build-provenance.txt apksigner-verification.txt > SHA512SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK and integrity bundle
        uses: actions/upload-artifact@v4
        with:
          name: haven-debug-apk-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/outputs/apk/debug/*.apk
            build-provenance.txt
            apksigner-verification.txt
            SHA256SUMS.txt
            SHA512SUMS.txt
