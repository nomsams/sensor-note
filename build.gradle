plugins {
    id 'com.android.application' apply from: ""
    id 'kotlin-android' apply from: ""
}

repositories {
    google()
    mavenCentral()
}

allprojects {
    project.ext {
        version_number = getVersionName()
        group_info = "haven"
        buildToolsVersion = "34.0.0"
        minSdkVersion = 16
        targetSdkVersion = 34
    }
}

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "org.havenapp.main"
        versionCode 2001
        versionName getVersionName()
        minSdkVersion 16
        targetSdkVersion 34
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        kotlinOptions {
            jvmTarget = "17"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.preference:preference-ktx:1.2.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.annotation:annotation:1.6.0"
    implementation "com.google.android.material:material:1.10.0"
    implementation "com.google.code.gson:2.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // Room
    implementation "androidx.room:room-runtime:2.8.1"
    kapt "androidx.room:room-compiler:2.8.1"
    implementation "androidx.room:room-ktx:2.8.1"

    implementation "androidx.lifecycle:lifecycle-extensions:2.8.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.3.1"

    // Camera/sensor (Central-only)
    implementation "com.otaliastudios:cameraview:2.6.4"
}
